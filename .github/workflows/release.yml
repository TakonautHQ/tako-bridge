---
name: Release assets

"on":
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
          no-cache: true
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run typecheck
      - run: bun audit
      - name: Build release archive
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          package_version="$(bun -p "require('./package.json').version")"
          test "$version" = "$package_version"
          mkdir -p dist
          bun pm pack --destination dist --quiet
          packed="$(find dist -name '*.tgz' -type f -print -quit)"
          archive="dist/tako-bridge-${version}.tgz"
          mv "$packed" "$archive"
          sha256sum "$archive" > "${archive}.sha256"
      - name: Preserve release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
